<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PR Reviewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div>
          <div class="brand-name">PR Reviewer</div>
          <div class="brand-sub">Your personal review bot</div>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" type="button" role="tab" data-tab="repos" aria-controls="view-repos">Repositories</button>
        <button class="tab" type="button" role="tab" data-tab="activity" aria-controls="view-activity">Activity</button>
      </nav>
      <span class="local-pill" id="local-pill" title="This page only answers on 127.0.0.1">Only on this Mac</span>
    </div>
  </header>

  <main>
    <div id="load-error" class="banner" role="alert" hidden>
      <span id="load-error-text"></span>
      <button id="retry" class="btn" type="button">Try again</button>
    </div>

    <section id="view-repos" class="view" role="tabpanel" aria-label="Repositories">
      <div class="stats" id="stats"></div>
      <fieldset id="editor" class="editor" disabled>
        <legend class="sr-only">Repository settings</legend>
        <div class="workspace">
          <aside class="sidebar" aria-label="Repository list">
            <div class="sidebar-head">
              <h2>Repositories</h2>
              <span class="count" id="repo-count"></span>
            </div>
            <div id="repo-list" class="repo-list"></div>
            <form id="add-form" class="add-form" novalidate>
              <label for="add-repo">Add a repository</label>
              <div class="add-row">
                <input id="add-repo" type="text" placeholder="owner/name or GitHub URL" autocomplete="off" spellcheck="false">
                <button id="add-button" class="btn primary icon-only" type="submit" aria-label="Add repository" disabled></button>
              </div>
              <p id="add-hint" class="field-hint">Paste a link or type <code>owner/name</code>.</p>
            </form>
          </aside>
          <div id="detail" class="detail"></div>
        </div>
      </fieldset>
    </section>

    <section id="view-activity" class="view" role="tabpanel" aria-label="Activity" hidden>
      <div class="activity-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>Recent reviews</h2>
            <div class="panel-tools">
              <span id="updated" class="muted small"></span>
              <button id="refresh" class="btn ghost sm" type="button">Refresh</button>
            </div>
          </div>
          <ol id="reviews" class="timeline"></ol>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>Bot log</h2>
            <div class="panel-tools">
              <input id="log-filter" class="search" type="search" placeholder="Filter" aria-label="Filter log lines">
              <label class="check"><input id="log-problems" type="checkbox"> Problems only</label>
            </div>
          </div>
          <div id="log" class="console" tabindex="0" aria-label="Bot log"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="savebar" class="savebar" hidden>
    <ul id="errors" class="savebar-errors" hidden></ul>
    <div class="savebar-row">
      <span class="savebar-dot"></span>
      <span id="savebar-text" class="savebar-text"></span>
      <button id="discard" class="btn ghost" type="button">Discard</button>
      <button id="save" class="btn primary" type="button">Save changes <kbd>⌘S</kbd></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <datalist id="models"></datalist>
  <script src="/app.js"></script>
</body>
</html>
